# Copy to config.yaml — edit role_keywords, track_keywords, and location_include anytime.

role_keywords:
  - intern
  - internship
  - trainee
  - management trainee

track_keywords:
  - backend
  - software engineer
  - ai engineer
  - it audit
  - business analyst
  - data analyst
  - data engineer
  - data analysis
  - erp consultant
  - erp developer
  - power bi
  - tableau
  - rapidminer
  - project manager
  - project management

include_keywords: []

# Blocked if they appear in the job title (QA, cyber, audit, etc.).
exclude_title_keywords:
  - quality assurance
  - cyber security
  - cybersecurity
  - it audit
  - qa

exclude_keywords: []

match_fields:
  - title
  - company
  - location
  - description

match_mode: any

location_include:
  - colombo

location_allow_remote: false
location_allow_empty: true

max_posting_age_days: 14
include_undated: false

telegram:
  send_job_images: true
  photo_delay_seconds: 0.35
  poster_only: true
  min_image_width: 400
  min_image_height: 300
  fetch_detail_images: true

sources:
  itpro:
    enabled: true
    max_pages: 3
  topjobs:
    enabled: true
    max_pages: 2
    search_terms:
      - backend intern
      - business analyst intern
      - data engineer intern
      - erp intern
      - project manager intern
  rooster:
    enabled: true
    max_pages: 2
    page_size: 20
    country: Sri Lanka
    search_terms:
      - intern
      - backend intern
      - project manager intern
  xpressjobs:
    enabled: false
    max_pages: 2
    page_size: 30
    listing_days: 14
    search_terms:
      - intern
      - IT intern
      - backend intern
      - project manager intern
  jobseeker:
    enabled: true
    max_pages: 3
    per_page: 50
    category_slugs:
      - internship
